# Template: copy to /etc/nginx/sites-available/ and symlink sites-enabled.
# Adjust server_name, SSL paths, and uploads alias to match UPLOADS_DIR in .env.

server {
    server_name plug-server.example.com;

    limit_conn plug_conn 80;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    proxy_buffering off;
    proxy_cache off;

    client_max_body_size 11m;

    proxy_connect_timeout 15s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location ^~ /uploads/ {
        alias /var/lib/plug_server/uploads/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location ~ ^/socket\.io(/|$) {
        include snippets/plug_server_proxy.conf;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }

    location = /docs {
        return 301 https://$host/docs/;
    }

    # No limit_req on /docs/ — Swagger loads many assets in parallel.
    location ^~ /docs/ {
        include snippets/plug_server_proxy.conf;
    }

    location = / {
        include snippets/plug_server_proxy.conf;
    }

    location = /favicon.ico {
        include snippets/plug_server_proxy.conf;
    }

    location = /site.webmanifest {
        include snippets/plug_server_proxy.conf;
    }

    location /assets/ {
        include snippets/plug_server_proxy.conf;
    }

    location = /metrics {
        limit_req zone=plug_metrics burst=20 nodelay;
        include snippets/plug_server_proxy.conf;
    }

    # Register and password-recovery request only (30/min). Login and refresh use
    # plug_api below — avoids 503 when many agents on one IP refresh after outage.
    location ~ ^/api/v1/(client-auth/(register|password-recovery/request)|auth/register)$ {
        limit_req zone=plug_auth_strict burst=10 nodelay;
        include snippets/plug_server_proxy.conf;
    }

    location ~ ^/auth/register$ {
        limit_req zone=plug_auth_strict burst=10 nodelay;
        include snippets/plug_server_proxy.conf;
    }

    location ~ ^/api/v1/agents/commands$ {
        limit_req zone=plug_api burst=300 nodelay;
        include snippets/plug_server_proxy.conf;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /api/v1/ {
        limit_req zone=plug_api burst=300 nodelay;
        include snippets/plug_server_proxy.conf;
    }

    location /auth/ {
        limit_req zone=plug_api burst=300 nodelay;
        include snippets/plug_server_proxy.conf;
    }

    location / {
        include snippets/plug_server_proxy.conf;
    }

    listen 443 ssl http2;
    ssl_certificate     /etc/letsencrypt/live/plug-server.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plug-server.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name plug-server.example.com;
    return 301 https://$host$request_uri;
}
