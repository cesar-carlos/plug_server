# Supplemental gzip tuning for plug_server. Requires `gzip on;` in the http block
# (enabled by default in nginx.conf on Ubuntu). Keep gzip_proxied off so Node
# upstream responses that are already compressed are not re-compressed.
gzip_vary on;
gzip_min_length 1024;
gzip_proxied off;
# Pre-compressed swagger-ui assets from `npm run sync:swagger-static` (creates *.gz).
gzip_static on;
gzip_types
    application/json
    application/javascript
    application/xml
    text/css
    text/html
    text/plain
    text/xml
    image/svg+xml;
