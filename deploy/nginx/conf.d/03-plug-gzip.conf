# Keep gzip_proxied off: Node may already compress proxied JSON (see docs/nginx_production.md).
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied off;
gzip_types
    application/json
    application/javascript
    application/xml
    text/css
    text/html
    text/plain
    text/xml
    image/svg+xml;
