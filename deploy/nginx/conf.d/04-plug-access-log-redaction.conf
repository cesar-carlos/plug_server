# Redact sensitive `token` query params from access logs (registration review/status,
# password-recovery review/status). Install in http { } via conf.d/.
map $request_uri $plug_redacted_request_uri {
    ~^(?<prefix>.*[?&]token=)[^&]+(?<suffix>.*)$ $prefix[REDACTED]$suffix;
    default $request_uri;
}

log_format plug_main '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $plug_redacted_request_uri $server_protocol" '
                     '$status $body_bytes_sent "$http_referer" '
                     '"$http_user_agent"';
