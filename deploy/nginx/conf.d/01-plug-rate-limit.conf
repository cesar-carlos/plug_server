# Edge rate limits (complement app-level limits). Do not add a zone for /docs/.
# plug_auth_strict: register + password-recovery request only (not login/refresh).
limit_req_zone $binary_remote_addr zone=plug_auth_strict:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=plug_api:10m rate=50r/s;
limit_req_zone $binary_remote_addr zone=plug_metrics:10m rate=120r/m;
limit_conn_zone $binary_remote_addr zone=plug_conn:10m;
