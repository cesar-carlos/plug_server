name: E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  communication-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: plug_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d plug_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/plug_e2e
      CONTAINER_PERSISTENCE_MODE: prisma
      CONTAINER_EMAIL_SENDER_MODE: noop
      E2E_TESTS_ENABLED: "true"
      AGENT_AUTO_UPDATE_DIAGNOSTICS_ENABLED: "true"
      INTEGRATION_REDIS_TESTS_ENABLED: "true"
      SOCKET_IO_REDIS_ADAPTER_URL: redis://127.0.0.1:6379
      REST_SOCKET_EVENT_IDEMPOTENCY_REDIS_URL: redis://127.0.0.1:6379
      SOCKET_RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up project
        uses: ./.github/actions/setup-node-project

      - name: Migrate E2E database
        run: npm run db:migrate:deploy

      - name: Run E2E suite
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e-output.log

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-artifacts
          if-no-files-found: ignore
          retention-days: 7
          path: |
            e2e-output.log
            npm-debug.log*
