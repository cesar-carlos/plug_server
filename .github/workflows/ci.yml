name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      socket: ${{ steps.filter.outputs.socket }}
      bench: ${{ steps.filter.outputs.bench }}
      rest_bench: ${{ steps.filter.outputs.rest_bench }}
    steps:
      - name: Detect affected paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "socket=true" >> "$GITHUB_OUTPUT"
            echo "bench=true" >> "$GITHUB_OUTPUT"
            echo "rest_bench=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename' | tee changed.txt

          socket=false
          bench=false
          rest_bench=false
          while IFS= read -r file; do
            case "$file" in
              .github/workflows/ci.yml|.github/actions/*|src/presentation/socket/*|src/shared/constants/socket_events*|src/shared/utils/payload_frame*|tests/fixtures/socket/*|tests/contract/socket*|tests/integration/agent_dart_socket_bridge*)
                socket=true
                ;;
            esac
            # Columnar codec, transport constants, and application modules the socket handlers call.
            case "$file" in
              tests/contract/columnar_agent.contract.test.ts|tests/helpers/plug_agente_contract*|src/infrastructure/codecs/*|src/shared/constants/agent_transport_contract*|src/application/agent_commands/*|src/application/services/agent_access.service*|src/application/services/agent_health_piggyback.service*|src/application/services/agent_hub_bridge_forward*|src/application/services/agent_hub_presence_sync*|src/application/services/agent_profile_broadcast_sink*|src/application/services/agent_profile_reliability_metrics.service*|src/application/services/agent_profile_sync.service*|src/application/services/bridge_latency_trace_builder*|src/application/services/bridge_rpc_method_metrics.service*|src/application/services/client_socket_event_publish.service*|src/application/services/consumer_socket_control_sink*|src/application/services/consumer_socket_event_sink*|src/application/services/server_timings_envelope*|src/application/services/socket_audit.service*)
                socket=true
                ;;
            esac
            case "$file" in
              .github/workflows/ci.yml|src/presentation/socket/*|tests/performance/*|tests/fixtures/performance/*|scripts/socket-bridge-bench*|vitest.perf.config.mjs)
                bench=true
                ;;
            esac
            case "$file" in
              .github/workflows/ci.yml|src/presentation/http/*|src/application/*|src/infrastructure/repositories/*|src/infrastructure/redis/*|src/shared/*|src/app.ts|src/server.ts|tests/performance/rest_api*|vitest.rest-perf.config.mjs|package.json|package-lock.json)
                rest_bench=true
                ;;
            esac
          done < changed.txt

          echo "socket=$socket" >> "$GITHUB_OUTPUT"
          echo "bench=$bench" >> "$GITHUB_OUTPUT"
          echo "rest_bench=$rest_bench" >> "$GITHUB_OUTPUT"

  static-checks:
    name: Static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up project
        uses: ./.github/actions/setup-node-project

      - name: Format, lint, types, image pins, and MCP contract
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run check:image-pins
          npm run contract:check

  test-and-build:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: plug_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d plug_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/plug_test
      INTEGRATION_REDIS_TESTS_ENABLED: "true"
      SOCKET_IO_REDIS_ADAPTER_URL: redis://127.0.0.1:6379
      REST_SOCKET_EVENT_IDEMPOTENCY_REDIS_URL: redis://127.0.0.1:6379
      SOCKET_RATE_LIMIT_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up project
        uses: ./.github/actions/setup-node-project

      - name: Migrate test database
        run: npm run db:migrate:deploy

      - name: Tests with critical coverage
        run: npm run test:coverage:critical

      - name: Build
        run: npm run build

  socket-bridge-bench:
    name: Socket bench
    needs: changes
    if: needs.changes.outputs.bench == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      NODE_ENV: test
      SOCKET_AUDIT_HIGH_VOLUME_SAMPLE_PERCENT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up project
        uses: ./.github/actions/setup-node-project

      - name: Resolve comparison commit
        id: base_ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            ref="$PR_BASE_SHA"
          else
            ref="$PUSH_BEFORE_SHA"
          fi
          zero="0000000000000000000000000000000000000000"
          if [ -z "$ref" ] || [ "$ref" = "$zero" ]; then
            echo "::warning::Comparison commit is unavailable; benchmark will measure the candidate only."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout comparison commit
        if: steps.base_ref.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.base_ref.outputs.ref }}
          path: bench-base
          persist-credentials: false

      - name: Measure comparison commit when benchmark is available
        if: steps.base_ref.outputs.available == 'true'
        run: |
          if [ ! -f bench-base/vitest.perf.config.mjs ]; then
            echo "::warning::Comparison commit predates the socket bridge benchmark; this bootstrap run checks correctness only."
            exit 0
          fi
          npm --prefix bench-base ci
          npm --prefix bench-base run db:generate
          # Compare runtime changes using identical benchmark scenarios on both revisions.
          cp tests/performance/*.ts bench-base/tests/performance/
          cp vitest.perf.config.mjs bench-base/vitest.perf.config.mjs
          # New columnar cases were rejected by old runtimes; compare only established scenarios.
          (cd bench-base && SOCKET_COLUMNAR_BENCH_DISABLED=true npm run test:perf:socket-bridge)
          echo "SOCKET_BRIDGE_BENCH_BASELINE_PATH=$GITHUB_WORKSPACE/bench-base/tmp/socket-bridge-bench.json" >> "$GITHUB_ENV"

      - name: Socket bridge performance bench
        id: bench
        # GitHub-hosted runners are noisy; keep the PR mergeable and surface the delta in the comment.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: npm run test:perf:socket-bridge

      - name: Comment bench summary
        if: github.event_name == 'pull_request' && hashFiles('tmp/socket-bridge-bench.json') != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BENCH_HEAD_PATH: tmp/socket-bridge-bench.json
          BENCH_BASE_PATH: ${{ env.SOCKET_BRIDGE_BENCH_BASELINE_PATH }}
          BENCH_OUTCOME: ${{ steps.bench.outcome }}
        run: python3 scripts/ci_post_socket_bridge_bench_comment.py

      - name: Upload bench report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: socket-bridge-bench
          path: |
            tmp/socket-bridge-bench.json
            tmp/socket-columnar-bench.json
          if-no-files-found: warn

  rest-api-bench:
    name: REST bench
    needs: changes
    if: needs.changes.outputs.rest_bench == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: plug_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d plug_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      CONTAINER_PERSISTENCE_MODE: prisma
      DATABASE_URL: postgresql://ci:ci@localhost:5432/plug_test
      AGENT_HUB_PRESENCE_ENABLED: "true"
      AGENT_HUB_PRESENCE_REDIS_URL: redis://127.0.0.1:6379
      REST_SOCKET_EVENT_IDEMPOTENCY_REDIS_URL: redis://127.0.0.1:6379
      HUB_INSTANCE_ID: rest-bench
      REST_AGENT_PROFILE_REFRESH_CONCURRENCY: "4"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up project
        uses: ./.github/actions/setup-node-project
      - name: Migrate isolated database and verify Prisma reads
        run: |
          npm run db:migrate:deploy
          npx vitest run tests/integration/infrastructure/repositories/rest_read_projections.integration.test.ts
      - name: Resolve comparison commit
        id: base_ref
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            ref="$PR_BASE_SHA"
          else
            ref="$PUSH_BEFORE_SHA"
          fi
          zero="0000000000000000000000000000000000000000"
          if [ -z "$ref" ] || [ "$ref" = "$zero" ]; then
            echo "::warning::Comparison commit is unavailable; benchmark will measure the candidate only."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout comparison commit
        if: steps.base_ref.outputs.available == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.base_ref.outputs.ref }}
          path: rest-bench-base
          persist-credentials: false
      - name: Measure base with the identical REST harness
        if: steps.base_ref.outputs.available == 'true'
        run: |
          if [ ! -f rest-bench-base/vitest.rest-perf.config.mjs ]; then
            echo "::warning::Comparison commit predates the REST API benchmark; this run checks the candidate only."
            exit 0
          fi
          npm --prefix rest-bench-base ci
          npm --prefix rest-bench-base run db:generate
          mkdir -p rest-bench-base/tests/performance
          cp tests/performance/rest_api_bench*.ts rest-bench-base/tests/performance/
          cp vitest.rest-perf.config.mjs rest-bench-base/
          (cd rest-bench-base && node --expose-gc node_modules/vitest/vitest.mjs run --config vitest.rest-perf.config.mjs)
          echo "REST_API_BENCH_BASELINE_PATH=$GITHUB_WORKSPACE/rest-bench-base/tmp/rest-api-bench.json" >> "$GITHUB_ENV"
      - name: Compare candidate without relaxing regression limits
        run: npm run test:perf:rest-api
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rest-api-bench
          path: |
            tmp/rest-api-bench.json
            tmp/rest-query-plans.json
            rest-bench-base/tmp/rest-api-bench.json
          if-no-files-found: warn

  socket-dart-contract:
    name: Dart contract
    needs: changes
    if: needs.changes.outputs.socket == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        agent_ref: [main, v1.8.5]
    env:
      PLUG_AGENTE_ROOT: ${{ github.workspace }}/plug_agente
      PLUG_SERVER_FIXTURE_DIR: ${{ github.workspace }}/tests/fixtures/socket
      REQUIRE_PLUG_AGENTE_CONTRACT: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout supported plug_agente version
        id: checkout_agente
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cesar-carlos/plug_agente
          ref: ${{ matrix.agent_ref }}
          token: ${{ secrets.PLUG_AGENTE_CHECKOUT_TOKEN || github.token }}
          path: plug_agente
          persist-credentials: false

      - name: Handle plug_agente checkout
        if: failure() && steps.checkout_agente.outcome == 'failure'
        run: |
          echo "::error::Failed to checkout cesar-carlos/plug_agente@${{ matrix.agent_ref }}. Set repository secret PLUG_AGENTE_CHECKOUT_TOKEN with contents:read on plug_agente if GITHUB_TOKEN cannot access that repository."
          exit 1

      - name: Set up project
        if: steps.checkout_agente.outcome == 'success'
        uses: ./.github/actions/setup-node-project

      - name: Validate shared fixtures against agent schemas
        if: steps.checkout_agente.outcome == 'success'
        run: |
          mkdir -p tmp
          printf 'hub=%s\nagent=%s\n' "$(git rev-parse HEAD)" "$(git -C plug_agente rev-parse HEAD)" | tee tmp/communication-revisions.txt
          npx vitest run tests/contract/socket_agent_inbound_fixtures.contract.test.ts tests/contract/columnar_agent.contract.test.ts

      - name: Set up Flutter
        if: steps.checkout_agente.outcome == 'success'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - name: Dart codec catalog
        if: steps.checkout_agente.outcome == 'success'
        working-directory: plug_agente
        run: |
          flutter pub get
          flutter test "$GITHUB_WORKSPACE/tests/fixtures/socket/plug_agente_hub_codec_test.dart"

      - name: Node hub bridge with real Dart Socket.IO client
        if: steps.checkout_agente.outcome == 'success'
        env:
          RUN_DART_SOCKET_E2E: "true"
          RUN_DART_PRODUCTION_TRANSPORT: ${{ matrix.agent_ref == 'main' && 'true' || 'false' }}
        run: npx vitest run tests/integration/agent_dart_socket_bridge.integration.test.ts

      - name: Upload cross-project revisions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: communication-revisions-${{ matrix.agent_ref }}
          path: tmp/communication-revisions.txt
          if-no-files-found: warn

  ci:
    name: Required
    if: always()
    needs:
      - changes
      - static-checks
      - test-and-build
      - socket-bridge-bench
      - rest-api-bench
      - socket-dart-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm required jobs
        run: |
          set -euo pipefail
          changes="${{ needs.changes.result }}"
          static="${{ needs.static-checks.result }}"
          tests="${{ needs.test-and-build.result }}"
          bench="${{ needs.socket-bridge-bench.result }}"
          rest_bench="${{ needs.rest-api-bench.result }}"
          dart="${{ needs.socket-dart-contract.result }}"
          echo "changes=$changes"
          echo "static-checks=$static"
          echo "test-and-build=$tests"
          echo "socket-bridge-bench=$bench"
          echo "socket-dart-contract=$dart"
          echo "rest-api-bench=$rest_bench"
          if [ "$changes" != "success" ] || [ "$static" != "success" ] || [ "$tests" != "success" ]; then
            exit 1
          fi
          if [ "$bench" != "success" ] && [ "$bench" != "skipped" ]; then
            exit 1
          fi
          if [ "$rest_bench" != "success" ] && [ "$rest_bench" != "skipped" ]; then
            exit 1
          fi
          if [ "$dart" != "success" ] && [ "$dart" != "skipped" ]; then
            exit 1
          fi
