services:
  # Production process. Host network keeps localhost Postgres, host Redis and
  # port 4000. Do not depend on the postgres/redis services below: on this
  # host those ports already belong to the host processes.
  hub:
    profiles: ["hub"]
    build: .
    network_mode: host
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=1536
      UV_THREADPOOL_SIZE: "8"
    volumes:
      - /var/lib/plug_server/uploads:/var/lib/plug_server/uploads
    restart: unless-stopped
    mem_limit: 2g
    stop_grace_period: 15s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health/live').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  postgres:
    # Digest matches .github/workflows/ci.yml. scripts/check_ci_image_pins.py enforces that.
    image: postgres:16-alpine@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-plug_server}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # Performance tuning for a ~16 GB host shared with other services.
    # Values mirror deploy/postgres/tuning.sql (ALTER SYSTEM) so a fresh
    # container and an already-running instance converge on the same config.
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=2GB"
      - "-c"
      - "effective_cache_size=6GB"
      - "-c"
      - "maintenance_work_mem=512MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "max_wal_size=2GB"
      - "-c"
      - "min_wal_size=512MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "random_page_cost=1.1"
      - "-c"
      - "effective_io_concurrency=200"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-plug_server}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  redis:
    # Digest matches .github/workflows/ci.yml. scripts/check_ci_image_pins.py enforces that.
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    # Required for multi-replica: Socket.IO adapter pub/sub, shared rate-limit
    # counters and distributed client:custom.* idempotency.
    # noeviction protects idempotency/stream keys from being dropped silently.
    command:
      - "redis-server"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "noeviction"
      - "--appendonly"
      - "yes"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 3s

volumes:
  postgres_data:
  redis_data:
